name: DAST (ZAP)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap:
    name: ZAP ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, full]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Scan the disposable calculator
        env:
          DAST_MODE: ${{ matrix.mode }}
        run: bash scripts/dast.sh "$DAST_MODE"
      - name: Publish scan summary
        if: ${{ always() }}
        env:
          DAST_MODE: ${{ matrix.mode }}
        run: |
          summary=".local/dast/$DAST_MODE/summary.md"
          if [[ -f "$summary" ]]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Preserve reports on success and failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/dast/${{ matrix.mode }}/
          if-no-files-found: error
          retention-days: 30
